spring:
  application:
    name: forms
  config:
    # Local secrets live in the repo-root .env (KEY=value, properties syntax).
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:oracle:thin:@//${ORACLE_HOST:localhost}:${ORACLE_PORT:1522}/${ORACLE_SERVICE:FREEPDB1}
    username: ${APP_DB_USER:forms}
    password: ${APP_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
